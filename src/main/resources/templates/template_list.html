<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Templates List</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: auto auto auto auto;
            padding: 10px;
        }

        .container .cell {
            background-color: dodgerblue;
            border: 1px solid black;
            padding: 30px;
            text-align: center;
            color: inherit;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center">Шаблоны</h1>
    <div class="container">
        <a th:each="template : ${templates}"
            th:text="${template.code}"
            th:href="@{/template_questions(template_id=${template.id})}"
            class="cell">
        </a>
    </div>
</body>
</html>
