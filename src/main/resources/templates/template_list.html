<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Templates List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .container {
            display: grid;
            grid-template-columns: auto auto auto auto;
            padding: 10px;
        }

        .container .cell {
            background-color: dodgerblue;
            border: 1px solid black;
            padding: 30px;
            text-align: center;
            color: inherit;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid justify-content-start">
            <img class="navbar-brand d-flex align-items-center" th:src="@{/logo.png}" alt="" height="36">
            <div class="navbar-nav">
                <a class="nav-link active pb-0" aria-current="page" href="/templates">Шаблоны</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <a th:each="template : ${templates}"
            th:text="${template.code}"
            th:href="@{/templates/{id}/questions(id=${template.id})}"
            class="cell">
        </a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
