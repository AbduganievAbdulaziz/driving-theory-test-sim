<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Templates List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script defer th:src="@{/alpine.min.js}"></script>
    <style>
        :root {
            --accent: #2563eb;
            --border: #e5e7eb;
            --text: #334155;
            --page-bg: #f8fafc;
        }

        body {
            background-color: var(--page-bg);
        }

        .templates {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
            max-width: 1360px;
            margin: 32px auto;
            padding: 0 16px;
        }

        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 88px;
            background-color: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
            text-decoration: none;
            transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease, color .15s ease;
        }

        .cell:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 6px 16px rgba(37, 99, 235, .12);
            transform: translateY(-2px);
        }
    </style>
    <script th:inline="javascript">
        window.LANGUAGES = /*[[${languages}]]*/ [];
    </script>
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container-fluid">
            <div class="navbar-nav ms-3">
                <img class="navbar-brand d-flex align-items-center" th:src="@{/logo.png}" alt="" height="36">
                <a class="nav-link active pb-0" aria-current="page" href="/templates">Шаблоны</a>
            </div>

            <div class="navbar-nav ms-auto me-3"
                 x-data="{
                    langPref: window.LANGUAGES[0],
                    languages: window.LANGUAGES,
                    setLangPref(lang) { this.langPref = lang; }
                 }">
                <div class="dropdown">
                    <a x-text="langPref.name || ''"
                       class="btn btn-secondary dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    </a>

                    <ul class="dropdown-menu">
                        <template x-for="lang in languages" :key="lang.id">
                            <li>
                                <button type="button"
                                        class="dropdown-item"
                                        x-text="lang.name"
                                        @click="setLangPref(lang)"></button>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="templates">
        <a th:each="template : ${templates}"
           th:text="${template.code}"
           th:href="@{/templates/{id}/questions(id=${template.id})}"
           class="cell">
        </a>
    </div>
</body>
</html>
